<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cambios COP & VED</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: url('fondo.jpg') no-repeat center center fixed; background-size: cover; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  .app { width: 100%; max-width: 420px; height: 90vh; padding: 18px; background: rgba(11, 18, 32, 0.7); display: flex; flex-direction: column; overflow-y: auto; border-radius: 20px; backdrop-filter: blur(5px); }
  h1 { text-align: center; font-size: 28px; margin-top: 10px; margin-bottom: 30px; color: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
  .card { background: rgba(17, 27, 46, 0.7); padding: 14px; border-radius: 12px; margin-bottom: 15px; }
  
  /* Etiqueta ajustada a 16px */
  label { display: block; font-size: 16px; opacity: 0.9; margin-bottom: 6px; text-align: center; font-weight: bold; }
  
  /* Valor ajustado a 26px */
  .large-input { font-size: 26px !important; text-align: center; font-weight: bold; width: 100%; padding: 12px; border-radius: 8px; border: none; background: #1c2a44; color: #fff; box-sizing: border-box; }
  
  .spacer { flex-grow: 1; min-height: 250px; }
</style>
</head>
<body>

<div class="app">
  <h1>Cambios COP & VED</h1>
  <div class="card"><label>COP</label><input type="text" id="cop" class="large-input" inputmode="decimal" placeholder="0"></div>
  <div class="card"><label>VED</label><input type="text" id="ved" class="large-input" readonly></div>
  <div class="card"><label>Tasa</label><input type="text" id="tasa" class="large-input" readonly></div>
  <div class="card"><label>Dólar BCV</label><input type="text" id="dolar_bcv" class="large-input" readonly placeholder="Cargando..."></div>
  <div class="card"><label>Total Dólares BCV</label><input type="text" id="total_bcv" class="large-input" readonly></div>
  
  <div class="spacer"></div>
  
  <div class="card"><label>Precio USDT</label><input type="number" id="precio_usdt" class="large-input" placeholder="Ingresa precio"></div>
</div>

<script>
const copInput = document.getElementById("cop"), vedInput = document.getElementById("ved"), tasaInput = document.getElementById("tasa"), dolarBcvInput = document.getElementById("dolar_bcv"), totalBcvInput = document.getElementById("total_bcv"), precioUsdtInput = document.getElementById("precio_usdt");

async function actualizarBCV() {
    const sheetId = '1v5poZUnXG3IszNxUaOvMhud38HZNPUXoYDmHE9iD9Zo';
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tq=SELECT%20A&range=A2:A2`;
    try {
        const response = await fetch(url);
        const text = await response.text();
        const json = JSON.parse(text.substring(47, text.length - 2));
        const valor = json.table.rows[0].c[0].v;
        dolarBcvInput.value = valor.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        calcular();
    } catch (e) {
        dolarBcvInput.value = "Error";
    }
}

function parseNumber(str) { return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0; }

function calcular() {
    const copVal = parseNumber(copInput.value);
    const bcvVal = parseNumber(dolarBcvInput.value);
    const precioUsdtVal = parseFloat(precioUsdtInput.value) || 0;
    
    if (copVal > 0 && precioUsdtVal > 0) {
        const usdVal = copVal / 4400;
        const vedVal = usdVal * precioUsdtVal;
        
        vedInput.value = vedVal.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        tasaInput.value = (vedVal / copVal).toFixed(4);
        
        if (bcvVal > 0) {
            totalBcvInput.value = (vedVal / bcvVal).toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
    }
}

copInput.addEventListener("input", (e) => {
    let val = e.target.value.replace(/\D/g, "");
    e.target.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    calcular();
});
precioUsdtInput.addEventListener("input", calcular);
actualizarBCV();
</script>
</body>
</html>
