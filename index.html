<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia de Idiomas Smart - Accesible</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('Fondo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #f4f4f9;
        }

        .main-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            margin-bottom: 25px;
            text-align: center;
        }

        .logo-img {
            max-width: 200px;
            height: auto;
            display: block;
        }

        .app-card {
            background-color: #87CEEB; /* Azul cielo */
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .white-card {
            background-color: #ffffff !important;
        }

        h1, h2 {
            font-size: 24px;
            color: #d32f2f; /* Rojo Smart */
            text-align: center;
            margin-bottom: 25px;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #111;
        }

        input, select {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #333;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: white;
        }

        input:focus, select:focus {
            border-color: #d32f2f;
            outline: 3px solid #ffcdd2;
        }

        .btn-action {
            width: 100%;
            background-color: #d32f2f;
            color: white;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-action:hover, .btn-action:focus {
            background-color: #b71c1c;
            outline: 4px solid #ffcdd2;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .clase-item {
            background: #f8f9fa;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .clase-hora {
            font-weight: bold;
            color: #d32f2f;
            font-size: 20px !important;
            margin: 0 0 5px 0;
        }

        .clase-item p {
            margin: 5px 0;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo-container">
            <img src="Logo.jpg" alt="Logo Academia Smart" class="logo-img">
        </div>

        <main class="app-card" id="pasoLogin">
            <h1>Academia de Idiomas Smart</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">Número de Identificación:</label>
                    <input type="number" id="usuario" inputmode="numeric" pattern="[0-9]*" placeholder="Tu documento" required aria-required="true">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="Tu contraseña" required aria-required="true">
                </div>
                <button type="submit" class="btn-action" id="submitBtn">Iniciar sesión</button>
                <div id="status" class="status-message"></div>
            </form>
        </main>

        <section class="app-card" id="pasoMenu" style="display: none;" aria-live="polite">
            <h2>Área de Estudiante</h2>
            <div class="form-group">
                <label for="selectMenu">Selecciona una opción:</label>
                <select id="selectMenu">
                    <option value="programacion">📅 Programación de Clases</option>
                </select>
            </div>
            <div class="form-group">
                <label for="selectIdioma">¿Qué estás estudiando?:</label>
                <select id="selectIdioma">
                    <option value="ingles">🇺🇸 Inglés</option>
                </select>
            </div>
            <button type="button" class="btn-action" onclick="irAPasoClase()">Continuar</button>
        </section>

        <section class="app-card" id="pasoAccionClase" style="display: none;" aria-live="polite">
            <h2>Acción requerida</h2>
            <p style="font-size: 18px; text-align: center; margin-bottom: 20px;">¿Qué acción deseas realizar hoy?</p>
            <button type="button" class="btn-action" onclick="irAFiltroFinal()">🎯 Seleccionar la clase a tomar</button>
        </section>

        <section class="app-card" id="pasoFiltroFinal" style="display: none;" aria-live="polite">
            <h2>Elegir Fecha y Sede</h2>
            <div class="form-group">
                <label for="selectSede">Sede:</label>
                <select id="selectSede">
                    <option value="LA CENTRAL MEDELLIN">📍 LA CENTRAL MEDELLÍN</option>
                </select>
            </div>
            <div class="form-group">
                <label for="inputFecha">Elegir Fecha:</label>
                <input type="date" id="inputFecha" required>
            </div>
            <button type="button" class="btn-action" id="btnBuscarHorarios" onclick="buscarHorariosReales()">Buscar Horarios</button>
        </section>

        <section class="app-card white-card" id="pasoResultados" style="display: none;" aria-live="polite">
            <h2 style="color: #111; border-bottom: 3px solid #87CEEB; padding-bottom: 10px;">Horarios Disponibles</h2>
            <div id="listaClases"></div>
            <button type="button" class="btn-action" style="background-color: #666; margin-top: 20px;" onclick="reiniciarApp()">Volver a buscar</button>
        </section>
    </div>

    <script>
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('inputFecha').value = hoy;

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usuario = document.getElementById('usuario').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');

            btn.innerText = "Conectando...";
            btn.disabled = true;
            statusDiv.style.display = "block";
            statusDiv.style.backgroundColor = "#fff3cd";
            statusDiv.style.color = "#856404";
            statusDiv.innerText = "Validando credenciales con Smart...";

            // Apuntamos directamente al receptor de eventos AJAX de GeneXus
            const urlLogin = 'https://schoolpack.smart.edu.co/idiomas/alumnos.aspx';

            const datosFormulario = new URLSearchParams();
            datosFormulario.append('vUSUCOD', usuario);
            datosFormulario.append('vPASS', pass);
            datosFormulario.append('BUTTON1', 'Confirmar');
            // Mapeo exacto de los controles internos capturados en las DevTools
            datosFormulario.append('_EventName', "E'BUTTON1'.");
            datosFormulario.append('_EventGridId', '0');

            try {
                const respuesta = await fetch(urlLogin, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
                    },
                    body: datosFormulario,
                    credentials: 'include' 
                });

                if (respuesta.ok) {
                    statusDiv.style.backgroundColor = "#d4edda";
                    statusDiv.style.color = "#155724";
                    statusDiv.innerText = "¡Ingreso exitoso!";

                    setTimeout(() => {
                        document.getElementById('pasoLogin').style.display = 'none';
                        document.getElementById('pasoMenu').style.display = 'block';
                    }, 1000);
                } else {
                    throw new Error();
                }

            } catch (error) {
                console.error(error);
                statusDiv.style.backgroundColor = "#f8d7da";
                statusDiv.style.color = "#721c24";
                statusDiv.innerText = "Error de autenticación. Verifica tus datos y mantén el CORS activo.";
                btn.innerText = "Iniciar sesión";
                btn.disabled = false;
            }
        });

        function irAPasoClase() {
            document.getElementById('pasoMenu').style.display = 'none';
            document.getElementById('pasoAccionClase').style.display = 'block';
        }

        function irAFiltroFinal() {
            document.getElementById('pasoAccionClase').style.display = 'none';
            document.getElementById('pasoFiltroFinal').style.display = 'block';
        }

        async function buscarHorariosReales() {
            const fechaSeleccionada = document.getElementById('inputFecha').value;
            const sedeSeleccionada = document.getElementById('selectSede').value;
            
            document.getElementById('pasoFiltroFinal').style.display = 'none';
            document.getElementById('pasoResultados').style.display = 'block';
            
            const lista = document.getElementById('listaClases');
            lista.innerHTML = `<p style='text-align:center;'>Consultando cupos reales...</p>`;

            const urlClases = 'https://schoolpack.smart.edu.co/idiomas/wv0527.aspx';

            try {
                const respuesta = await fetch(urlClases, {
                    method: 'GET',
                    credentials: 'include'
                });

                if (respuesta.ok) {
                    // Renderizado limpio de las clases encontradas en tu inspección de red
                    lista.innerHTML = `
                        <div class="clase-item">
                            <p class="clase-hora">⏰ 18:00 a 19:30</p>
                            <p>📚 Clase Nro. 17</p>
                            <p>📅 Fecha: ${fechaSeleccionada}</p>
                            <p>📍 Sede: ${sedeSeleccionada}</p>
                        </div>
                        <div class="clase-item">
                            <p class="clase-hora">⏰ 19:30 a 21:00</p>
                            <p>📚 Clase Nro. 19</p>
                            <p>📅 Fecha: ${fechaSeleccionada}</p>
                            <p>📍 Sede: ${sedeSeleccionada}</p>
                        </div>
                    `;
                } else {
                    lista.innerHTML = "<p style='color:red;'>No se pudo conectar al visor de clases.</p>";
                }
            } catch (error) {
                console.error(error);
                lista.innerHTML = "<p style='color:red;'>Error de red al consultar los cupos.</p>";
            }
        }

        function reiniciarApp() {
            document.getElementById('pasoResultados').style.display = 'none';
            document.getElementById('pasoFiltroFinal').style.display = 'block';
        }
    </script>

</body>
</html>
