<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa de Cambio COP ↔ VES</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 20px;
    }

    label {
      margin-top: 15px;
      display: block;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: #2d7ff9;
    }

    .note {
      margin-top: 15px;
      font-size: 12px;
      text-align: center;
      color: #666;
    }

    .badge {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
      color: #333;
      background: #eef3ff;
      padding: 8px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Casa de Cambio COP ↔ VES</h1>

    <div class="badge">
      Calculadora sin decimales
    </div>

    <label>COP (lo que paga el cliente)</label>
    <input type="number" id="cop" placeholder="Ej: 100000">

    <label>VES (lo que tú depositas)</label>
    <input type="number" id="ves" placeholder="Ej: 1000000">

    <label>Tasa</label>
    <input type="number" id="tasa" placeholder="Ej: 40">

    <div class="note">
      Puedes escribir en COP o VES y se calcula automáticamente
    </div>
  </div>

<script>
  const copInput = document.getElementById("cop");
  const vesInput = document.getElementById("ves");
  const tasaInput = document.getElementById("tasa");

  function round(n) {
    return Math.round(n);
  }

  let lock = false;

  function copToVes() {
    if (lock) return;
    lock = true;

    const cop = Number(copInput.value);
    const tasa = Number(tasaInput.value);

    if (cop && tasa) {
      vesInput.value = round(cop * tasa);
    }

    lock = false;
  }

  function vesToCop() {
    if (lock) return;
    lock = true;

    const ves = Number(vesInput.value);
    const tasa = Number(tasaInput.value);

    if (ves && tasa) {
      copInput.value = round(ves / tasa);
    }

    lock = false;
  }

  copInput.addEventListener("input", copToVes);
  vesInput.addEventListener("input", vesToCop);
  tasaInput.addEventListener("input", copToVes);
</script>

</body>
</html>
