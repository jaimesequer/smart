<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambios COP & VED</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: url('fondo.jpg') no-repeat center center fixed; background-size: cover; color: white; display: flex; justify-content: center; min-height: 100vh; }
  .app { width: 100%; max-width: 420px; padding: 18px; background: rgba(11, 18, 32, 0.85); display: flex; flex-direction: column; }
  h1 { text-align: center; font-size: 20px; margin-bottom: 18px; }
  .card { background: rgba(17, 27, 46, 0.9); padding: 14px; border-radius: 12px; margin-bottom: 12px; }
  .card-usd { display: none; }
  label { font-size: 12px; opacity: 0.9; }
  input { width: 100%; margin-top: 6px; padding: 12px; border-radius: 8px; border: none; font-size: 16px; outline: none; box-sizing: border-box; }
  input[readonly] { background: #1c2a44; color: #9ca3af; }
  .btn { background: #2563eb; color: white; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; font-size: 14px; margin-bottom: 10px; }
  .spacer { flex-grow: 1; min-height: 50px; }
</style>
</head>
<body>
<div class="app">
  <h1>Cambios COP & VED</h1>
  <div class="card">
    <label>COP</label>
    <input type="text" id="cop" placeholder="Ej: 100.000">
  </div>
  <div class="card">
    <label>VED</label>
    <input type="text" id="ved" readonly>
  </div>
  <div class="card">
    <label>Tasa (VED / COP)</label>
    <input type="text" id="tasa" readonly>
  </div>
  <div class="spacer"></div>
  <div class="card">
    <label>Precio USDT</label>
    <div class="btn" onclick="obtenerPrecioBinance()">Actualizar Precio Binance</div>
    <input type="number" id="precio_usdt" placeholder="Ingresa precio manualmente">
  </div>
</div>

<script>
const copInput = document.getElementById("cop");
const vedInput = document.getElementById("ved");
const tasaInput = document.getElementById("tasa");
const precioUsdtInput = document.getElementById("precio_usdt");

const vedFormatter = new Intl.NumberFormat('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function parseNumber(str) { return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0; }

async function obtenerPrecioBinance() {
    precioUsdtInput.placeholder = "Consultando...";
    try {
        // Nota: Esta llamada puede fallar por seguridad si no está en un servidor web
        const response = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent("https://p2p.binance.com/bapi/c2c/v2/friendly/c2c/adv/search"));
        const data = JSON.parse(await response.json().then(res => res.contents));
        precioUsdtInput.value = data.data[0].adv.price;
        calcular();
    } catch (error) {
        alert("No se pudo obtener el precio automáticamente. Ingresa el precio de Binance manualmente.");
        precioUsdtInput.placeholder = "Ingresa precio manualmente";
    }
}

function calcular() {
    const copVal = parseNumber(copInput.value);
    const precioUsdtVal = parseFloat(precioUsdtInput.value) || 0;
    if (copVal > 0 && precioUsdtVal > 0) {
        const usdVal = copVal / 4400;
        const vedVal = usdVal * precioUsdtVal;
        vedInput.value = vedFormatter.format(vedVal);
        tasaInput.value = (vedVal / copVal).toFixed(4);
    }
}

copInput.addEventListener("input", (e) => {
    let val = e.target.value.replace(/\D/g, "");
    e.target.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    calcular();
});
precioUsdtInput.addEventListener("input", calcular);
</script>
</body>
</html>
