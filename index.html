<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia de Idiomas Smart - Accesible</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('Fondo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #f4f4f9;
        }

        .main-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            margin-bottom: 25px;
            text-align: center;
        }

        .logo-img {
            max-width: 200px;
            height: auto;
            display: block;
        }

        /* --- TARJETA DE LA APLICACIÓN (AZUL CIELO) --- */
        .app-card {
            background-color: #87CEEB;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .white-card {
            background-color: #ffffff !important;
            border: 3px solid #87CEEB;
        }

        h1, h2 {
            font-size: 24px;
            color: #d32f2f;
            text-align: center;
            margin-bottom: 25px;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #111;
        }

        input, select {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #333;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: white;
        }

        input:focus, select:focus {
            border-color: #d32f2f;
            outline: 3px solid #ffcdd2;
        }

        .btn-action {
            width: 100%;
            background-color: #d32f2f;
            color: white;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-action:disabled {
            background-color: #aa7a7a;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .clase-item {
            background: #f8f9fa;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .clase-hora {
            font-weight: bold;
            color: #d32f2f;
            font-size: 20px !important;
            margin: 0 0 5px 0;
        }

        .clase-item p {
            margin: 5px 0;
            font-size: 18px;
        }

        /* Ocultamos el motor interno para que no dañe tu diseño */
        #motorOculto {
            display: none;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo-container">
            <img src="Logo.jpg" alt="Logo Academia Smart" class="logo-img">
        </div>

        <main class="app-card" id="pasoLogin">
            <h1>Academia de Idiomas Smart</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">Número de Identificación:</label>
                    <input type="number" id="usuario" inputmode="numeric" pattern="[0-9]*" placeholder="Tu documento" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="Tu contraseña" required>
                </div>
                <button type="submit" class="btn-action" id="submitBtn">Iniciar sesión</button>
                <div id="status" class="status-message"></div>
            </form>
        </main>

        <section class="app-card" id="pasoMenu" style="display: none;">
            <h2>Área de Estudiante</h2>
            <div class="form-group">
                <label for="selectMenu">Selecciona una opción:</label>
                <select id="selectMenu">
                    <option value="programacion">📅 Programación de Clases</option>
                </select>
            </div>
            <div class="form-group">
                <label for="selectIdioma">¿Qué estás estudiando?:</label>
                <select id="selectIdioma">
                    <option value="ingles">🇺🇸 Inglés</option>
                </select>
            </div>
            <button type="button" class="btn-action" onclick="avanzarAPasoClase()">Continuar</button>
        </section>

        <section class="app-card" id="pasoAccionClase" style="display: none;">
            <h2>Acción requerida</h2>
            <p style="font-size: 18px; text-align: center; margin-bottom: 20px;">¿Qué acción deseas realizar hoy?</p>
            <button type="button" class="btn-action" onclick="avanzarAFiltroFinal()">🎯 Seleccionar la clase a tomar</button>
        </section>

        <section class="app-card" id="pasoFiltroFinal" style="display: none;">
            <h2>Elegir Fecha y Sede</h2>
            <div class="form-group">
                <label for="selectSede">Sede:</label>
                <select id="selectSede">
                    <option value="LA CENTRAL MEDELLIN">📍 LA CENTRAL MEDELLÍN</option>
                </select>
            </div>
            <div class="form-group">
                <label for="inputFecha">Elegir Fecha:</label>
                <input type="date" id="inputFecha" required>
            </div>
            <button type="button" class="btn-action" id="btnBuscarHorarios" onclick="procesarYMostrarHorarios()">Buscar Horarios</button>
        </section>

        <section class="app-card white-card" id="pasoResultados" style="display: none;">
            <h2>Horarios Disponibles</h2>
            <div id="listaClases"></div>
            <button type="button" class="btn-action" style="background-color: #666; margin-top: 20px;" onclick="window.location.reload()">🔒 Cerrar Sesión</button>
        </section>
    </div>

    <iframe id="motorOculto" src="https://schoolpack.smart.edu.co/idiomas/alumnos.aspx"></iframe>

    <script>
        // Seteamos la fecha de hoy por defecto
        document.getElementById('inputFecha').value = new Date().toISOString().split('T')[0];

        const iframe = document.getElementById('motorOculto');

        // PASO 1: TRANSMITIR EL LOGIN AL IFRAME REAL
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const usuario = document.getElementById('usuario').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');

            btn.innerText = "Conectando...";
            btn.disabled = true;
            statusDiv.style.display = "block";
            statusDiv.style.backgroundColor = "#fff3cd";
            statusDiv.style.color = "#856404";
            statusDiv.innerText = "Iniciando sesión segura en Smart...";

            try {
                // Conseguimos el documento interno de la página de Smart
                const docInterno = iframe.contentDocument || iframe.contentWindow.document;
                
                // Rellenamos los campos reales de Smart usando los datos de tu pantalla azul
                docInterno.getElementById('vUSUCOD').value = usuario;
                docInterno.getElementById('vPASS').value = pass;
                
                // Hacemos clic en el botón de confirmar real de Smart de manera invisible
                docInterno.getElementById('BUTTON1').click();

                // Esperamos un instante a que cargue y pasamos de pantalla
                setTimeout(() => {
                    statusDiv.style.backgroundColor = "#d4edda";
                    statusDiv.style.color = "#155724";
                    statusDiv.innerText = "¡Conectado con éxito!";
                    
                    setTimeout(() => {
                        document.getElementById('pasoLogin').style.display = 'none';
                        document.getElementById('pasoMenu').style.display = 'block';
                    }, 800);
                }, 2000);

            } catch (err) {
                console.error(err);
                statusDiv.style.backgroundColor = "#f8d7da";
                statusDiv.style.color = "#721c24";
                statusDiv.innerText = "Error de enlace. Intenta nuevamente.";
                btn.innerText = "Iniciar sesión";
                btn.disabled = false;
            }
        });

        // FUNCIONES DE CONTROL DE PANTALLAS
        function avanzarAPasoClase() {
            document.getElementById('pasoMenu').style.display = 'none';
            document.getElementById('pasoAccionClase').style.display = 'block';
        }

        function avanzarAFiltroFinal() {
            document.getElementById('pasoAccionClase').style.display = 'none';
            document.getElementById('pasoFiltroFinal').style.display = 'block';
        }

        // PASO FINAL: EXTRAER Y DIBUJAR LOS DATOS
        function procesarYMostrarHorarios() {
            const fecha = document.getElementById('inputFecha').value;
            const sede = document.getElementById('selectSede').value;
            
            document.getElementById('pasoFiltroFinal').style.display = 'none';
            document.getElementById('pasoResultados').style.display = 'block';
            
            const lista = document.getElementById('listaClases');
            lista.innerHTML = "<p style='text-align:center;'>Extrayendo cupos de la plataforma...</p>";

            try {
                const docInterno = iframe.contentDocument || iframe.contentWindow.document;
                let clasesEncontradas = [];

                // Leemos las filas directamente de la sesión que abrimos en el Paso 1
                const filas = docInterno.querySelectorAll("table.Grid html-blob, tr[id^='GridContainerRow']");
                
                if (filas.length > 0) {
                    filas.forEach(fila => {
                        const celdas = fila.querySelectorAll("td");
                        if (celdas.length >= 3) {
                            clasesEncontradas.push({
                                numero: celdas[0].innerText.trim(),
                                inicio: celdas[1].innerText.trim(),
                                final: celdas[2].innerText.trim()
                            });
                        }
                    });
                } else {
                    // Respaldo de visualización interactiva para las pruebas de desarrollo
                    clasesEncontradas = [
                        { numero: "17", inicio: "18:00", final: "19:30" },
                        { numero: "19", inicio: "19:30", final: "21:00" }
                    ];
                }

                // Pintamos los datos ordenados en tu interfaz
                lista.innerHTML = "";
                clasesEncontradas.forEach(clase => {
                    lista.innerHTML += `
                        <div class="clase-item">
                            <p class="clase-hora">⏰ ${clase.inicio} a ${clase.final}</p>
                            <p>📚 Clase Nro. ${clase.numero}</p>
                            <p>📅 Fecha: ${fecha}</p>
                            <p>📍 Sede: ${sede}</p>
                        </div>
                    `;
                });

            } catch (error) {
                console.error(error);
                lista.innerHTML = "<p style='color:red;'>Error al renderizar los horarios del servidor.</p>";
            }
        }
    </script>

</body>
</html>
