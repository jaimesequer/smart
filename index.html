<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cambios COP & VED</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('fondo.jpg') no-repeat center center fixed;
    background-size: cover;
    color: white;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 420px;
    padding: 18px;
    background: rgba(11, 18, 32, 0.85);
    display: flex;
    flex-direction: column;
  }

  h1 { text-align: center; font-size: 20px; margin-bottom: 18px; }
  .card { background: rgba(17, 27, 46, 0.9); padding: 14px; border-radius: 12px; margin-bottom: 12px; }
  .card-usd { display: none; }
  label { font-size: 12px; opacity: 0.9; }
  
  input {
    width: 100%; margin-top: 6px; padding: 12px; border-radius: 8px; border: none;
    font-size: 16px; outline: none; box-sizing: border-box;
  }

  input[readonly] { background: #1c2a44; color: #9ca3af; }
  .spacer { flex-grow: 1; min-height: 50px; }

  .btn-share {
    background: #10b981;
    color: white;
    padding: 14px;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    font-weight: bold;
    margin-top: 20px;
    border: none;
    font-size: 16px;
  }
</style>
</head>

<body>

<div class="app">
  <h1>Cambios COP & VED</h1>

  <div class="card">
    <label>COP</label>
    <input type="text" id="cop" placeholder="Ej: 100.000">
  </div>

  <div class="card">
    <label>VED</label>
    <input type="text" id="ved" readonly>
  </div>

  <div class="card">
    <label>Tasa (VED / COP)</label>
    <input type="text" id="tasa" readonly>
  </div>

  <div class="spacer"></div>

  <div class="card card-usd">
    <label>USD</label>
    <input type="text" id="usd" readonly>
  </div>

  <div class="card">
    <label>Precio USDT</label>
    <input type="number" id="precio_usdt" placeholder="Ingresa precio">
  </div>

  <button id="btn-share" class="btn-share" onclick="compartirOperacion()">Compartir Operación</button>
</div>

<script>
const copInput = document.getElementById("cop");
const vedInput = document.getElementById("ved");
const tasaInput = document.getElementById("tasa");
const usdInput = document.getElementById("usd");
const precioUsdtInput = document.getElementById("precio_usdt");

const vedFormatter = new Intl.NumberFormat('es-CO', { 
  minimumFractionDigits: 2, 
  maximumFractionDigits: 2 
});

function parseNumber(str) { return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0; }

function calcular() {
    const copVal = parseNumber(copInput.value);
    const precioUsdtVal = parseFloat(precioUsdtInput.value) || 0;

    if (copVal > 0) {
        const usdVal = copVal / 4400;
        usdInput.value = usdVal.toFixed(2);

        if (precioUsdtVal > 0) {
            const vedVal = usdVal * precioUsdtVal;
            vedInput.value = vedFormatter.format(vedVal);
            tasaInput.value = (vedVal / copVal).toFixed(4);
        } else {
            vedInput.value = "";
            tasaInput.value = "";
        }
    } else {
        vedInput.value = "";
        usdInput.value = "";
        tasaInput.value = "";
    }
}

function compartirOperacion() {
  const copRaw = copInput.value;
  const vedRaw = vedInput.value;
  const tasaRaw = tasaInput.value;

  const copNumerico = parseNumber(copRaw);
  const vedNumerico = parseNumber(vedRaw.replace(/\./g, '').replace(',', '.'));

  if (copNumerico > 0 && vedNumerico > 0) {
    const texto = `💰 *Detalle de Cambio*\n\n` +
                  `*COP:* ${copRaw}\n` +
                  `*VED:* ${vedRaw}\n` +
                  `*Tasa:* ${tasaRaw}\n`;

    if (navigator.share) {
      navigator.share({
        title: 'Cambio COP & VED',
        text: texto
      }).catch(err => console.log('Acción cancelada'));
    } else {
      navigator.clipboard.writeText(texto.replace(/\*/g, ''));
      alert("Texto copiado al portapapeles:\n\n" + texto.replace(/\*/g, ''));
    }
  } else {
    alert("Realiza un cálculo primero.");
  }
}

copInput.addEventListener("input", (e) => {
    let val = e.target.value.replace(/\D/g, "");
    e.target.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    calcular();
});

precioUsdtInput.addEventListener("input", calcular);
</script>

</body>
</html>
