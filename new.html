<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cambios COP & VED</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #0b1220; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  .app { width: 100%; max-width: 420px; height: 90vh; padding: 18px; background: rgba(17, 27, 46, 0.9); display: flex; flex-direction: column; overflow-y: auto; border-radius: 20px; }
  h1 { text-align: center; font-size: 24px; margin-bottom: 20px; }
  .card { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
  label { display: block; font-size: 12px; opacity: 0.8; margin-bottom: 5px; text-align: center; font-weight: bold; }
  .large-input { font-size: 22px; text-align: center; font-weight: bold; width: 100%; padding: 10px; border-radius: 8px; border: none; background: #1c2a44; color: white; box-sizing: border-box; }
  .push-down { flex-grow: 1; }
</style>
</head>

<body>

<div class="app">
  <h1>Cambios COP & VED</h1>

  <div class="card">
    <label>COP</label>
    <input type="text" id="cop" class="large-input" inputmode="decimal" placeholder="0">
  </div>

  <div class="card">
    <label>VED</label>
    <input type="text" id="ved" class="large-input" readonly>
  </div>

  <div class="card">
    <label>Tasa</label>
    <input type="text" id="tasa" class="large-input" readonly>
  </div>

  <div class="card">
    <label>Dólar BCV</label>
    <input type="text" id="dolar_bcv" class="large-input" readonly placeholder="Cargando...">
  </div>

  <div class="push-down"></div>

  <div class="card">
    <label>Precio USDT</label>
    <input type="number" id="precio_usdt" class="large-input" placeholder="Ingresa precio">
  </div>
</div>

<script>
const copInput = document.getElementById("cop");
const vedInput = document.getElementById("ved");
const tasaInput = document.getElementById("tasa");
const dolarBcvInput = document.getElementById("dolar_bcv");
const precioUsdtInput = document.getElementById("precio_usdt");

async function actualizarBCV() {
    const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQXwjW4RSRaHFnIqwZYnziVxz45zuaUhIU3NNOE78DyYOOZApEky98I5pgDi4auLTlCWLEHuFrkyYs3/pub?gid=0&single=true&output=csv';
    try {
        const response = await fetch(url);
        const data = await response.text();
        const lineas = data.split(/\r?\n/);
        if (lineas.length > 1) {
            // Tomamos la fila 2, columna 1
            let valor = lineas[1].split(',')[0].replace(/"/g, '').trim();
            dolarBcvInput.value = valor; // Se muestra tal cual viene del CSV
        }
    } catch (e) {
        dolarBcvInput.value = "Error";
    }
}

function parseNumber(str) { return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0; }

function calcular() {
    const copVal = parseNumber(copInput.value);
    const precioUsdtVal = parseFloat(precioUsdtInput.value) || 0;

    if (copVal > 0 && precioUsdtVal > 0) {
        const usdVal = copVal / 4400;
        const vedVal = usdVal * precioUsdtVal;
        vedInput.value = vedVal.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        tasaInput.value = (vedVal / copVal).toFixed(4);
    }
}

copInput.addEventListener("input", (e) => {
    let val = e.target.value.replace(/\D/g, "");
    e.target.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    calcular();
});

precioUsdtInput.addEventListener("input", calcular);
actualizarBCV();
</script>

</body>
</html>
