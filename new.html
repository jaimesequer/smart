<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cambios COP & VED</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('fondo.jpg') no-repeat center center fixed;
    background-size: cover;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .app {
    width: 100%;
    max-width: 420px;
    height: 90vh;
    padding: 18px;
    background: rgba(11, 18, 32, 0.7); 
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    border-radius: 20px;
    backdrop-filter: blur(5px);
  }

  h1 { text-align: center; font-size: 28px; margin-top: 10px; margin-bottom: 30px; color: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
  .card { background: rgba(17, 27, 46, 0.7); padding: 14px; border-radius: 12px; margin-bottom: 15px; }
  label { display: block; font-size: 12px; opacity: 0.9; margin-bottom: 4px; }
  
  .center-label { text-align: center; font-size: 18px !important; font-weight: bold; opacity: 1 !important; }
  .large-input { font-size: 24px !important; text-align: center; font-weight: bold; }

  input { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 16px; outline: none; box-sizing: border-box; }
  input[readonly] { background: #1c2a44; color: #fff; }
  .push-down { margin-top: 150px; }
</style>
</head>

<body>

<div class="app">
  <h1>Cambios COP & VED</h1>

  <div class="card">
    <label class="center-label">COP</label>
    <input type="text" id="cop" class="large-input" inputmode="decimal" placeholder="0">
  </div>

  <div class="card">
    <label class="center-label">VED</label>
    <input type="text" id="ved" class="large-input" readonly>
  </div>

  <div class="card">
    <label class="center-label">Tasa</label>
    <input type="text" id="tasa" class="large-input" readonly>
  </div>

  <div class="card">
    <label class="center-label">Dólar BCV</label>
    <input type="text" id="dolar_bcv" class="large-input" readonly placeholder="Cargando...">
  </div>

  <div class="push-down"></div>

  <div class="card">
    <label>Precio USDT</label>
    <input type="number" id="precio_usdt" placeholder="Ingresa precio">
  </div>
</div>

<script>
const copInput = document.getElementById("cop");
const vedInput = document.getElementById("ved");
const tasaInput = document.getElementById("tasa");
const dolarBcvInput = document.getElementById("dolar_bcv");
const precioUsdtInput = document.getElementById("precio_usdt");

const vedFormatter = new Intl.NumberFormat('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

async function actualizarBCV() {
    // Usamos el modo "no-cors" si el acceso directo falla por seguridad
    const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQXwjW4RSRaHFnIqwZYnziVxz45zuaUhIU3NNOE78DyYOOZApEky98I5pgDi4auLTlCWLEHuFrkyYs3/pub?gid=0&single=true&output=csv';
    
    try {
        const response = await fetch(url);
        const data = await response.text();
        const lineas = data.split('\n');
        
        if (lineas.length > 1) {
            // Limpieza básica: tomamos la celda A2
            let valor = lineas[1].split(',')[0].replace(/"/g, '').trim();
            dolarBcvInput.value = valor;
        }
    } catch (e) {
        // Si hay error, intentamos una segunda vez o mostramos una pista
        dolarBcvInput.value = "Error de red";
    }
}

function parseNumber(str) { return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0; }

function calcular() {
    const copVal = parseNumber(copInput.value);
    const precioUsdtVal = parseFloat(precioUsdtInput.value) || 0;

    if (copVal > 0) {
        const usdVal = copVal / 4400;
        if (precioUsdtVal > 0) {
            const vedVal = usdVal * precioUsdtVal;
            vedInput.value = vedFormatter.format(vedVal);
            tasaInput.value = (vedVal / copVal).toFixed(4);
        }
    }
}

copInput.addEventListener("input", (e) => {
    let val = e.target.value.replace(/\D/g, "");
    e.target.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    calcular();
});

precioUsdtInput.addEventListener("input", calcular);

// Llamada inicial
actualizarBCV();
</script>

</body>
</html>
